[[bin]]
name = "compact-decode"
path = "fuzz_targets/compact_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bitmap-roundtrip"
path = "fuzz_targets/bitmap_roundtrip.rs"
test = false
doc = false
bench = false

# Build the fuzz target with debug assertions and overflow checks on.
[profile.release]
debug = true
debug-assertions = true
overflow-checks = true
