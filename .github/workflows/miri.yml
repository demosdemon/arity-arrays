name: Miri

# Reusable Miri runner shared by the per-PR CI job (ci.yml) and the daily full
# sweep (miri-full.yml). Callers vary only the proptest case count and the
# per-shard timeout.
#
# The matrix is an exhaustive, non-overlapping partition of `--workspace
# --tests` under the default feature set: Miri runs with default features, so
# the feature-gated `serde_*` test targets compile to no-ops and need no shard.
# A new *ungated* `tests/*.rs` target is NOT picked up automatically — add a
# shard here for it. The heavy binaries are split by test name so each shard
# fits under GitHub's 6h hosted-job limit, and each split is exhaustive and
# disjoint. The `mutation` binary splits by arity: the `mutation-256` shard runs
# every `*_arity256` test (packed and gapped) via the `_arity256` substring
# filter, and the `mutation` shard runs the rest via `--skip _arity256`.
#
# Size shards for the slowest hosted runner, not the typical one. Two 256-case
# runs of the same commit (2026-11) found some ubuntu-26.04 instances ~1.7x
# slower than others, consistently across every test in a shard. A shard's
# wall-clock time is about max(longest test, total test time / 4): nextest
# runs one single-threaded Miri test per vCPU, and these runners ran 4 at a
# time. .config/nextest.toml starts the longest tests first so that bound
# holds. On the slow runner `tries-model-256` measured 4.8h before
# prioritization and projects to ~3.9h with it; `tries-model-in-memory` and
# `tries-model-rc-value` project to ~3.5-3.7h from measured per-test times.
# That leaves ~2h of headroom for test growth before a shard needs splitting.
on:
  workflow_call:
    inputs:
      proptest-cases:
        description: Proptest cases per test (sets PROPTEST_CASES).
        type: string
        required: true
      timeout-minutes:
        description: Per-shard runaway guardrail, in minutes.
        type: number
        required: false
        default: 300

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lib
            args: --workspace --lib
          - name: roundtrip
            args: -p arity-arrays --test roundtrip
          - name: bitmap
            args: -p arity-bitmap --test proptests --test generic_use
          - name: mutation
            args: -p arity-arrays --test mutation -- --skip _arity256
          - name: mutation-256
            args: -p arity-arrays --test mutation -- _arity256
          - name: trie
            args: -p arity-arrays --test trie_internals
          # arity-tries: the model binary is the heaviest (~45 CPU-hours of
          # Miri at 256 cases on a slow runner, measured 2026-11), so it
          # splits three ways. The
          # arity-256 tests get their own shard; the rest split by test
          # family, with the second filterset the exact complement of the
          # first so a new test lands in one of them automatically.
          - name: tries-model-256
            args: -p arity-tries --test model -E 'test(/_arity256$/)'
          - name: tries-model-in-memory
            args: >-
              -p arity-tries --test model
              -E 'not test(/_arity256$/) and test(/^(in_memory|hash|atomic)_/)'
          - name: tries-model-rc-value
            args: >-
              -p arity-tries --test model
              -E 'not test(/_arity256$/) and not test(/^(in_memory|hash|atomic)_/)'
          - name: tries-early-drop
            args: -p arity-tries --test early_drop
          - name: tries-shapes
            args: -p arity-tries --test shapes
    env:
      # disable-isolation: the round-trip proptests read/write their regression
      # files on disk and seed from host entropy; strict-provenance stays on.
      MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-disable-isolation"
      PROPTEST_CASES: ${{ inputs.proptest-cases }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: miri
      - uses: taiki-e/install-action@v2.87.10
        with:
          tool: cargo-nextest
      - run: cargo +nightly miri nextest run ${{ matrix.args }}
