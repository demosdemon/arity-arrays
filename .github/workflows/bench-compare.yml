name: Bench compare

# Reusable A/B benchmark comparison, shared by the trigger-specific callers
# (bench-compare-pr.yml, bench-compare-dispatch.yml, bench-compare-push.yml).
# Runs base/head single-pass on quick runs, or base/head/head/base
# (interleaved A/B/B/A) on full-precision runs, on one runner so both captures
# share the same hardware/thermal noise floor, diffs them via `xtask compare`,
# and publishes to the job summary. No `permissions:` block here — the
# reusable workflow inherits whatever the calling job grants, mirroring
# miri.yml. Every caller grants only `contents: read`: the captures build and
# run the compared refs' code, which for a PR may come from a fork.
#
# The base/head capture steps intentionally never invoke `just`/`xtask` — only
# `cargo`/`cargo-criterion` directly. Those repo-tracked tools may not exist yet
# at an older base-ref (notably the very first comparison run after this
# workflow is added). `xtask` is built once up front from THIS workflow's ref
# (before any capture checks out another ref) and stashed, so `Render
# comparison` runs a tool whose CLI matches this workflow's invocation even
# when a compared ref has a different xtask CLI.
on:
  workflow_call:
    inputs:
      base-ref:
        description: Git ref/SHA to treat as "before".
        type: string
        required: true
      head-ref:
        description: Git ref/SHA to treat as "after".
        type: string
        required: true
      quick:
        description: >-
          Reduce sample count/timing for a faster, noisier comparison. Selects
          the bench harness's BENCH_MODE (`quick` when true, `ci` when false),
          not a Criterion CLI flag: cargo-criterion (needed for
          --message-format=json) does not forward --quick, --sample-size, or
          any other criterion CLI flag to the harness the way plain
          `cargo bench` does, and criterion.toml has no sample-size knob
          either, so the harness reads the env var directly. See
          crates/arity-arrays/benches/bench_mode.rs for each mode's settings.
        type: boolean
        required: true
      pr-number:
        description: >-
          PR head-ref belongs to, when it may be a fork commit. Required when
          head-ref is a fork commit not otherwise reachable in this
          repository. Typed string, not number: a
          workflow_dispatch string input forwarded by expression into a
          number-typed workflow_call input fails Actions' template validation
          (actions/runner#2848).
        type: string
        required: false
      timeout-minutes:
        description: >-
          Per-run guardrail, in minutes. Default (90) covers quick mode,
          which stays single-pass (base once, head once). Budget: ~1050
          benchmark points per capture (the throughput and trie benches; count
          the `benchmark-complete` records in a capture's JSON) at
          ~1.4s/point with plotting disabled, so ~25 min per capture and
          ~55 min per run with setup. Before plotting was disabled the same
          run needed ~5s/point and outgrew this default. Re-check the
          estimate when the point count grows materially.
          Full-precision callers (bench-compare-push.yml, and
          bench-compare-dispatch.yml with quick=false) override this to 330 for the interleaved
          base/head/head/base run (four captures instead of two), capped
          30 min under GitHub's 360-minute hosted-runner ceiling.
          BENCH_MODE=ci is sized to fit that: ~3.3s/point (0.5s warm-up, 1.5s
          or more of measurement, then analysis overhead), so ~1h per capture
          and ~4-4.5h for the run. Criterion's own defaults would need ~12h.
        type: number
        required: false
        default: 90

jobs:
  compare:
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      CARGO_TERM_COLOR: always
      BASE_REF: ${{ inputs.base-ref }}
      HEAD_REF: ${{ inputs.head-ref }}
      PR_NUMBER: ${{ inputs.pr-number }}
      # Read directly by the bench harness, not by Criterion's own CLI parsing;
      # see the `quick` input's description above.
      BENCH_MODE: ${{ inputs.quick && 'quick' || 'ci' }}
      # Read only by base/head refs whose harness predates BENCH_MODE: it
      # treated any set BENCH_QUICK, even an empty one, as quick mode, and
      # ignores BENCH_MODE. Setting it keeps such a capture in quick mode
      # rather than criterion's defaults, which would overrun the timeout.
      # Current harnesses ignore it. Remove it once no comparison needs a ref
      # older than the BENCH_MODE harness.
      BENCH_QUICK: "1"
    steps:
      - uses: $/.github/actions/setup-rust
        with:
          fetch-depth: 0
          toolchain: nightly
          tools: cargo-criterion

      - name: Fetch PR head
        if: inputs.pr-number != ''
        run: git fetch origin "refs/pull/$PR_NUMBER/head"

      # Build and stash xtask from this workflow's ref BEFORE the capture steps
      # check out other refs (see the file header). $RUNNER_TEMP is outside the
      # work tree, so the binary survives those checkouts, and building early
      # surfaces an xtask build failure before the long capture steps.
      - name: Build and stash xtask
        run: |
          cargo build --release -p xtask
          cp target/release/xtask "$RUNNER_TEMP/xtask"

      # No --all-features here (unlike ci.yml's `bench` smoke-test job): none of the
      # optional features (serde, serde_with, std) gate any bench code (no
      # `#[cfg(feature = ...)]` in benches/), so --all-features would only add compile
      # time, not comparison coverage. The local `bench-export` recipe omits it too.
      #
      # --plotting-backend disabled: nothing consumes cargo-criterion's HTML/SVG
      # reports here (only the JSON on stdout feeds `xtask compare`), and on a
      # Linux runner the plotters backend dominates the run: a quick capture on
      # ubuntu-26.04 spent ~4.3s of every ~5.1s benchmark point (~83% of its
      # wall-clock time) after the point's result printed, and a 4-CPU Linux
      # reproduction measured ~4.9s/point with plots against ~1.4s without. The
      # flag belongs to the installed cargo-criterion, not the checked-out
      # tree, so it works at any base ref.
      #
      # Interleave base/head/head/base on one runner (FULL-PRECISION runs only)
      # so each ref's two captures straddle the run's midpoint symmetrically
      # (base at slots 1+4, head at slots 2+3 — both centroid at 2.5), which
      # cancels slow *linear* thermal/turbo drift in the base-vs-head
      # differential rather than merely sharing it — exact when the four captures
      # are evenly spaced in wall-clock time; the back-to-back head pair skips a
      # rebuild, a second-order asymmetry dwarfed by the multi-minute capture
      # cost. `xtask compare` averages the two captures per ref (point = mean,
      # interval = envelope). Quick runs skip the second pair and stay
      # single-pass. These capture steps still
      # invoke only cargo/cargo-criterion — never just/xtask — so they work at an
      # older base-ref that predates the repo-tracked tools.
      - name: Capture base
        run: |
          git checkout "$BASE_REF"
          cargo criterion -p arity-arrays --plotting-backend disabled --message-format=json > base1.json

      - name: Capture head
        run: |
          git checkout "$HEAD_REF"
          cargo criterion -p arity-arrays --plotting-backend disabled --message-format=json > head1.json

      - name: Capture head (interleave replicate)
        if: ${{ !inputs.quick }}
        run: |
          git checkout "$HEAD_REF"
          cargo criterion -p arity-arrays --plotting-backend disabled --message-format=json > head2.json

      - name: Capture base (interleave replicate)
        if: ${{ !inputs.quick }}
        run: |
          git checkout "$BASE_REF"
          cargo criterion -p arity-arrays --plotting-backend disabled --message-format=json > base2.json

      - name: Render comparison
        run: |
          if [ "${{ inputs.quick }}" = "true" ]; then
            HEAD_FILES=(head1.json)
            BASE_FILES=(base1.json)
          else
            HEAD_FILES=(head1.json head2.json)
            BASE_FILES=(base1.json base2.json)
          fi
          "$RUNNER_TEMP/xtask" compare --head "${HEAD_FILES[@]}" --base "${BASE_FILES[@]}" > compare.md
          if [ "${{ inputs.quick }}" = "true" ]; then
            { printf '> [!NOTE]\n> Quick mode: reduced sample count, single-pass A/B (no interleaving), noisier than a full run.\n\n'; cat compare.md; } > compare.md.tmp
            mv compare.md.tmp compare.md
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: bench-compare-${{ github.run_id }}
          path: |
            base1.json
            base2.json
            head1.json
            head2.json
            compare.md

      - name: Publish job summary
        run: cat compare.md >> "$GITHUB_STEP_SUMMARY"
