name: Bench compare (PR)

# Automatic quick A/B benchmark comparison for pull requests, via the reusable
# bench-compare.yml workflow. Results land in the job summary (linked from the
# PR's checks) and as a downloadable artifact.
#
# Runs under pull_request, not pull_request_target: the comparison builds and
# executes the PR's code (build scripts, proc macros, bench bodies), so it must
# hold no privilege worth stealing. Under pull_request a fork PR gets a
# read-only GITHUB_TOKEN and no secrets, and the repository's approval policy
# for fork PR workflows decides whether a run waits for a maintainer. Posting a
# PR comment would need a write token, either in the same job as that code or
# in a separate privileged workflow_run job that treats this run's output as
# untrusted, so results go to the job summary instead.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  compare:
    # A new push to the PR cancels the comparison of the commit it replaces.
    concurrency:
      group: bench-compare-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    uses: $/.github/workflows/bench-compare.yml
    with:
      base-ref: ${{ github.event.pull_request.base.sha }}
      head-ref: ${{ github.event.pull_request.head.sha }}
      quick: true
      pr-number: ${{ github.event.pull_request.number }}
