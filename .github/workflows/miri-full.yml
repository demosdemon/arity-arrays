name: Miri (full)

# The per-PR Miri job in ci.yml runs a reduced proptest spread (PROPTEST_CASES=8)
# to keep pull-request feedback fast. This workflow runs the full 256-case spread
# via the shared reusable workflow (miri.yml), sharded so no single shard
# approaches GitHub's 6h limit.
#
# Scheduled runs only fire on the default branch. Use workflow_dispatch to trigger
# the full spread on demand (e.g. before a release).
on:
  schedule:
    - cron: "0 7 * * *" # daily at 07:00 UTC (00:00 US/Pacific)
  workflow_dispatch:

jobs:
  miri:
    uses: $/.github/workflows/miri.yml
    with:
      proptest-cases: "256"
      # GitHub-hosted jobs are hard-capped at 6h whatever timeout-minutes
      # says, so a larger value here is silently clamped. 350 keeps the failure
      # an explicit timeout rather than a platform cancellation. Shards are
      # sized at ~3.5-4h on the slowest observed runner (see miri.yml), so
      # hitting this means a shard has outgrown its split, not normal noise.
      timeout-minutes: 350
