[package]
name = "arity-index"
version = "0.1.3"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bounds-check-free niche integer index types (U3-U7) with double-ended range iterators"
keywords = ["niche", "integer", "index", "no-std", "bitfield"]
categories = ["no-std", "data-structures", "rust-patterns"]

[dependencies]
seq-macro = { version = "0.3.6", optional = true }
serde = { version = "1", optional = true, default-features = false }

[lints]
workspace = true

[features]
default = ["8", "16", "32", "64", "128", "256"]
"8" = ["dep:seq-macro"]
"16" = ["dep:seq-macro"]
"32" = ["dep:seq-macro"]
"64" = ["dep:seq-macro"]
"128" = ["dep:seq-macro"]
"256" = []
serde = ["dep:serde"]
std = ["serde?/std"]

[dev-dependencies]
serde_json = "1.0.150"
